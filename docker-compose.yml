services:
  postgres:
    image: postgres:16-alpine
    container_name: quorum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum
    ports:
      - "5432:5432"
    volumes:
      - quorum-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quorum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  quorum-pgdata:
